<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E3A2F">
<title>TF Story Studio — কী বানাবেন আজ?</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--g:#1E3A2F;--g2:#2A4D3E;--go:#E9B949;--ink:#17201B;--sub:#66706A;--line:#E2E6E1;--bg:#F6F7F4;--card:#fff;--soft:#EEF1EC;--isl:#0f3d24;--islgo:#c9a227}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:SolaimanLipi,"Noto Sans Bengali","Hind Siliguri","Nirmala UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:20px 16px 4px;max-width:560px;width:100%;margin:0 auto}
.top img{width:40px;height:40px;border-radius:11px;display:block}
.top b{font-size:18px}
main{flex:1;max-width:560px;width:100%;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;line-height:1.3;margin:12px 0 6px;font-weight:800}
.part{position:relative;display:flex;align-items:center;gap:16px;min-height:88px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:border-color .15s,background-color .15s}
.part:hover{border-color:var(--g)}
.part:active{background:#FAFBF9}
.part,.acct button{touch-action:manipulation}
.part:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.part .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none;background:var(--g)}
.part.isl .ic{background:var(--isl)}
.part .tx{flex:1;min-width:0}
.part b{display:block;font-size:19px;line-height:1.3}
.part p{margin:2px 0 0;font-size:14px;line-height:1.45;color:var(--sub)}
.part::after{content:"›";font-size:28px;line-height:1;color:#9AA39D}
.part .last{position:absolute;top:-8px;right:14px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--go);color:#2b2200}
.acct{display:flex;align-items:center;gap:12px;margin-top:8px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.acct .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:18px;overflow:hidden;flex:none}
.acct .av img{width:100%;height:100%;object-fit:cover}
.acct .who{flex:1;min-width:0}
.acct .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .who small{display:block;color:var(--sub);font-size:13px;margin-top:1px;line-height:1.4}
.acct button{font:inherit;font-weight:700;font-size:14px;min-height:44px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;background:var(--g);color:#fff;flex:none}
.acct button.out{background:transparent;color:var(--ink);border:1px solid var(--line)}
.acct button:disabled{opacity:.6}
.acct button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.err{margin:0;color:#b4231a;font-size:13px}
footer{text-align:center;color:var(--sub);font-size:12px;padding:6px 16px 18px}
@media (prefers-reduced-motion:reduce){.part{transition:none}}
@media (prefers-color-scheme:dark){
  :root{--ink:#eceee9;--sub:#a3aaa6;--line:#2b302d;--bg:#121513;--card:#1a1e1b;--soft:#24302a}
  .part:active{background:#1f2420}
}
</style>
</head>
<body>
<header class="top">
  <img src="icon-192.png" alt="" width="40" height="40">
  <b translate="no">TF Story Studio</b>
</header>
<main>
  <h1>আজ কী বানাবেন?</h1>
  <a class="part story" id="goStory" href="index.html">
    <span class="ic" aria-hidden="true">📖</span>
    <span class="tx"><b>গল্প</b><p>শর্ট ও লং গল্পের ভিডিও</p></span>
  </a>
  <a class="part isl" id="goIslamic" href="index.html?part=islamic">
    <span class="ic" aria-hidden="true">🕋</span>
    <span class="tx"><b>ইসলামিক</b><p>কুরআন-হাদিসের গল্প, আয়াত ও বাণী</p></span>
  </a>
  <section class="acct" id="acct" aria-label="অ্যাকাউন্ট">
    <span class="av" id="acAv" aria-hidden="true">👤</span>
    <div class="who"><b id="acName">Gmail দিয়ে লগইন</b><small id="acSub">সব ডিভাইসে আপনার গল্প থাকবে</small></div>
    <button type="button" id="acBtn">লগইন</button>
  </section>
  <p class="err" id="acErr" hidden></p>
</main>
<footer id="ver">TF Story Studio</footer>
<script src="cloud-core.js"></script>
<script>
'use strict';
(function(){
  const $ = id => document.getElementById(id);
  let last = ''; try{ last = localStorage.getItem('tf_suite_last') || ''; }catch(e){}
  const tag = { story:'goStory', islamic:'goIslamic' }[last];
  if(tag){ const b = document.createElement('span'); b.className = 'last'; b.textContent = 'শেষবার'; $(tag).append(b); }
  const remember = k => { try{ localStorage.setItem('tf_suite_last', k); }catch(e){} };
  $('goStory').addEventListener('click', () => remember('story'));
  $('goIslamic').addEventListener('click', () => remember('islamic'));
  /* the one login for the whole app */
  const C = window.TFCloud, btn = $('acBtn'), err = m => { $('acErr').textContent = m || ''; $('acErr').hidden = !m; };
  const paint = u => {
    if(!C.usable()){ $('acct').hidden = true; return; }
    btn.hidden = false; btn.disabled = false;
    if(u){
      const ph = /^https:\/\/lh3\.googleusercontent\.com\//.test(u.photoURL || '') ? u.photoURL : '';
      $('acAv').innerHTML = ''; if(ph){ const i = document.createElement('img'); i.src = ph; i.alt = ''; i.referrerPolicy = 'no-referrer'; $('acAv').append(i); } else $('acAv').textContent = '✓';
      $('acName').textContent = u.displayName || u.email || 'লগইন করা আছে'; $('acSub').textContent = u.email || 'লগইন করা আছে';
      btn.textContent = 'লগআউট'; btn.className = 'out';
    } else {
      $('acAv').textContent = '👤'; $('acName').textContent = 'Gmail দিয়ে লগইন';
      $('acSub').textContent = 'সব ডিভাইসে আপনার গল্প থাকবে';
      btn.textContent = 'লগইন'; btn.className = '';
    }
    err(C.err);
  };
  C.on(paint); C.start();
  btn.addEventListener('click', async () => {
    err('');
    if(C.user){
      if(!confirm('লগআউট করবেন? সব অংশ থেকেই লগআউট হবে। আপনার গল্প ও হিস্ট্রি ক্লাউডে নিরাপদ থাকবে।')) return;
      btn.disabled = true; btn.textContent = 'লগআউট হচ্ছে…'; await C.signOut(); paint(null); return;
    }
    btn.disabled = true; btn.textContent = 'লগইন হচ্ছে…';
    try{ await C.signIn(); }catch(e){ if(!/popup-closed-by-user|cancelled-popup-request/.test((e && e.code) || '')) err(e.code === 'loading' ? e.message : C.msg(e)); }
    paint(C.user);
  });
  try{ if(window.TFAndroid && window.TFAndroid.appVersion) $('ver').textContent = 'TF Story Studio · ভার্সন ' + window.TFAndroid.appVersion(); }catch(e){}
})();
</script>
</body>
</html>
