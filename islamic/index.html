<style>
:root{
  --bg:#f5f4f1;--surface:#fff;--surface-2:#f0eee9;--text:#1c1b19;--muted:#6b675f;--faint:#a19c92;--line:#e3dfd6;
  --accent:#1f6b4a;--accent-soft:#e3f1ea;--gold:#b8901f;--danger:#b42318;--ok:#1d7a46;
  --warn-bg:#fff7e6;--warn-line:#f3d79a;--warn-text:#7a4b00;
  --sans:'Inter','Hind Siliguri','Nirmala UI','Segoe UI',system-ui,sans-serif;
}
html[data-mode="general"]{--accent:#b4235a;--accent-soft:#fbe7ef}
html[data-theme="dark"]{--bg:#121214;--surface:#1b1b1e;--surface-2:#252529;--text:#ebe9e4;--muted:#a3a09a;--faint:#6f6c66;--line:#333338;--accent-soft:#1d2e27;--warn-bg:#2a2214;--warn-line:#5a4520;--warn-text:#f0c879}
html[data-theme="dark"][data-mode="islamic"]{--accent:#5fbf8e}
html[data-theme="dark"][data-mode="general"]{--accent:#f07aa5;--accent-soft:#36202a}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
a{color:var(--accent)}
/* header */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.brand b{font-size:15px;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.ctrls{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13px;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
html[data-theme="dark"] .btn.primary{color:#111}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:focus-visible,.seg button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.seg.mode button{padding:7px 14px;font-weight:600}
@media (max-width:640px){.brand small,.lbl{display:none}.seg.mode button{padding:7px 9px}}
/* layout */
.app{max-width:1320px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:18px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:1fr}}
.stage{position:sticky;top:74px}
@media (max-width:900px){.stage{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.canvasbox{background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--bg) 0 50%) 0 0/22px 22px;border-radius:14px 14px 0 0;padding:12px;display:flex;justify-content:center}
#cv{max-width:100%;max-height:calc(100vh - 230px);width:auto;height:auto;display:block;touch-action:none;cursor:grab;box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:2px}
@media (max-width:900px){#cv{max-height:70vh}}
#cv.dragging{cursor:grabbing}
.stagebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line)}
.stagebar .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint{font-size:12px;color:var(--muted);padding:0 12px 10px;margin:0}
.warnline{font-size:12.5px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);border-radius:8px;padding:7px 10px;margin:0 12px 10px}
/* panel */
.panel{overflow:hidden}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:6px 6px 0;background:var(--surface-2);scrollbar-width:thin}
.tab{border:0;background:transparent;padding:9px 13px;border-radius:9px 9px 0 0;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 -1px 0 var(--line) inset}
.pane{padding:16px}
.sect{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--bg)}
.sect h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sect h4 small{font-weight:400;color:var(--muted);font-size:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:9px;min-width:0}
.fld:last-child{margin-bottom:0}
.fld small{font-size:11.5px;color:var(--faint)}
.pane input[type=text],.pane input[type=url],.pane input[type=password],.pane input[type=number],.pane select,.pane textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--text);font-size:14px;outline:none}
.pane textarea{resize:vertical;line-height:1.65;font-family:'Hind Siliguri','Nirmala UI',var(--sans)}
.pane input:focus,.pane select:focus,.pane textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.ar{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;font-size:18px;direction:rtl}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.row>.fld{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane input[type=range]{width:100%;accent-color:var(--accent)}
.pane input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface);cursor:pointer}
.colors{display:flex;gap:14px;flex-wrap:wrap}
.colors label{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--text)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.55}
.warn{font-size:12.5px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);padding:8px 10px;border-radius:8px;margin:8px 0;line-height:1.55}
.okbox{font-size:12.5px;background:var(--accent-soft);color:var(--accent);padding:8px 10px;border-radius:8px;margin:8px 0}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.meta{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:7px 10px;margin-top:8px;line-height:1.6}
.meta b{color:var(--text)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-family:'Hind Siliguri','Nirmala UI',sans-serif;font-size:14.5px;line-height:1.6}
.opt .oh{font-size:12px;color:var(--accent);font-weight:600}
.opt .or{font-size:12.5px;color:var(--muted)}
.opt .row{margin-top:6px}
/* template gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tpl{border:2px solid transparent;border-radius:10px;padding:0;background:var(--surface-2);overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:center}
.tpl canvas{width:100%;display:block;aspect-ratio:1/1;background:var(--surface-2)}
.tpl span{font-size:11.5px;padding:4px 2px 5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl.on{border-color:var(--accent)}.tpl.on span{color:var(--accent);font-weight:600}
.pals{display:flex;flex-wrap:wrap;gap:6px}
.pal{width:38px;height:28px;border-radius:7px;border:2px solid var(--line);padding:0;overflow:hidden;display:flex}
.pal i{flex:1;display:block}
.pal:hover{border-color:var(--accent)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs button{width:60px;height:60px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.prev{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.prev img{width:74px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);flex:none}
.erow{display:grid;grid-template-columns:92px minmax(0,1fr) 40px 44px 30px;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.erow b{font-weight:500;color:var(--text)}.erow .pct{font-size:11.5px;text-align:right}.erow .auto{font-size:10.5px;color:var(--faint);text-align:center;display:block}
.erow .btn{padding:4px 6px}
details.dd{padding:0}
details.dd>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;font-weight:600;font-size:13.5px;user-select:none}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary::after{content:'▾';font-size:14px;color:var(--muted);transition:transform .15s}
details.dd[open]>summary::after{transform:rotate(180deg)}
details.dd>summary small{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
details.dd[open]>summary small{display:none}
details.dd>.ddb{padding:0 12px 12px}
.posbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-bottom:10px}
.posbar small{color:var(--muted);font-size:12px;flex:1 1 180px}
#rvCv{touch-action:none;cursor:grab}
.rpos{margin:0;padding:8px 12px;background:#0d0d0f}.rpos small{color:#c9c9cf}.rpos .btn{flex:none}
.prev img.logo{object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/12px 12px}
.lib{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:8px}
.libi{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface)}
.libi div{flex:1;min-width:0;font-family:'Hind Siliguri','Nirmala UI',sans-serif}
.libi b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libi small{color:var(--muted);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flash{animation:fl 1.2s}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
textarea.cap{min-height:260px;font-size:15px!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border-radius:12px;padding:12px;max-width:min(96vw,1000px);max-height:96vh;display:flex;flex-direction:column;gap:10px}
.modal-box img{max-width:100%;max-height:calc(96vh - 80px);object-fit:contain;display:block;margin:0 auto}
.modal-box .row{justify-content:center}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13.5px;z-index:90;transition:all .2s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
html[data-mode="general"] .isl-only{display:none!important}

/* ===== polish ===== */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,.tab,.chip,.btn{touch-action:manipulation}
.top{padding-top:env(safe-area-inset-top)}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--accent) 20%,var(--gold) 50%,var(--accent) 80%,transparent);opacity:.7}
html[data-mode="islamic"] .brand .logo{background:linear-gradient(135deg,#0f3d24,#1f6b4a);box-shadow:inset 0 0 0 2px #c9a227}
.card{box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05)}
.btn.primary{box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.tab i{font-style:normal}
#pvBtn{display:none}
.banner{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--gold) 14%,var(--surface)));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));font-size:13px}
.banner b{flex:1 1 180px}
#updateBar{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:95;background:var(--text);color:var(--bg);padding:8px 10px 8px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#updateBar .btn{background:var(--accent);color:#fff;border:0}
.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.7}
@media (min-width:901px){ .tab i{margin-right:5px} }
@media (max-width:900px){
  .top .in{height:54px;padding:0 10px}
  .app{padding:8px 8px calc(86px + env(safe-area-inset-bottom));gap:10px;grid-template-columns:minmax(0,1fr)}
  .stage,.panel{min-width:0}
  .stage{position:sticky;top:calc(55px + env(safe-area-inset-top));z-index:30;border-radius:14px}
  .canvasbox{padding:6px}
  #cv{max-height:var(--pvh,36vh)}
  #pvBtn{display:inline-flex}
  .hint{display:none}
  .warnline{margin:0 8px 6px;font-size:12px;padding:5px 8px}
  .stagebar{flex-wrap:nowrap;overflow-x:auto;padding:7px 8px;gap:6px;justify-content:flex-start;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .stagebar::-webkit-scrollbar{display:none}
  .stagebar .grp{flex-wrap:nowrap;gap:6px}
  .stagebar .btn,.stagebar .seg button{white-space:nowrap;padding:8px 11px}
  .stagebar .grp{display:contents}
  #monoBtn{order:-8}#reelBtn{order:-7}#pngBtn{order:-6}#shareBtn{order:-5}#undoBtn{order:-4}#redoBtn{order:-3}#ratioSeg{order:-2;flex:none}#pvBtn{order:-1}
  .panel{overflow:visible}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;justify-content:space-around;gap:2px;padding:5px 4px calc(5px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -6px 20px rgba(0,0,0,.07);overflow:visible}
  .tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px 5px;border-radius:12px;font-size:10.5px;line-height:1.15;transition:background .15s,color .15s}
  .tab i{font-size:19px;line-height:1.1}
  .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.on{background:var(--accent-soft);box-shadow:none}
  .pane{padding:12px 10px}
  .sect{padding:12px 11px;border-radius:14px}
  .pane input[type=text],.pane input[type=url],.pane input[type=password],.pane input[type=number],.pane select,.pane textarea{font-size:16px;padding:10px 11px}
  .btn{padding:9px 12px}
  .btn.sm{padding:7px 10px}
  .chip{padding:8px 13px}
  .erow{grid-template-columns:74px minmax(0,1fr) 34px 44px 32px;gap:6px}
  .gallery{grid-template-columns:repeat(3,1fr)}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom))}
  .modal{padding:10px}
}
@media (max-width:560px){
  .brand b,.brand small{display:none}
  .desk-only{display:none!important}
  .seg.mode .lbl{display:inline}
  .seg.mode button{padding:7px 10px}
  .ctrls{gap:5px}
}
@media (display-mode: standalone){ .install-ui{display:none!important} }
/* share window */
.shopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--text)}
.shopt small{color:var(--muted);font-size:12.5px;line-height:1.45}
.shopt.on{border-color:var(--accent);background:var(--accent-soft)}
.shopt:active{transform:scale(.99)}
.shprev{white-space:pre-line;font-size:13px;line-height:1.6;max-height:180px;overflow:auto;border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:6px;font-family:'Hind Siliguri','Nirmala UI',sans-serif}
#pasteBar{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:85;background:var(--accent);color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;line-height:1.45}

<style id="v3">
/* ===================== TF Post Maker v3 — one job per tab, one place to finish ===================== */
/* segmented sub-switches inside tabs */
.v3seg{margin:0 0 12px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:var(--r)}
.v3seg button{padding:10px 6px;font-size:14px;border-radius:11px}
.v3seg button.on,html[data-theme="dark"] .v3seg button.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.v3pagehead{display:flex;align-items:center;gap:8px;margin:2px 2px 12px;font-size:18px}
/* card size row */
.v3ratio h4{margin:0!important;flex-wrap:wrap}
.v3ratio #ratioSeg button{padding:7px 10px;font-size:13px;font-family:'Inter',sans-serif}
/* highlight row + AI tools inside the editor */
.v3hl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-2px 0 12px}
.v3hl>span{font-size:12.5px;font-weight:600;color:var(--muted);margin-right:2px}
.v3hl .chip,.v3tools .chip{padding:6px 12px;font-size:13px}
.v3tools{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.v3toolhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--accent)}
.v3toolhead b{flex:1;font-size:14px;color:var(--text)}
.v3toolhead .btn{min-height:32px}
.v3tools .keyhint{margin:0 0 10px}
#cardTextSect h4 .btn{min-height:32px}
/* stage actions */
.stagebar{display:flex!important;flex-wrap:nowrap;gap:8px;justify-content:center}
#v3ExportBtn{position:relative;min-width:150px}
.v3dot{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:transparent;box-shadow:0 0 0 2px var(--accent)}
#v3ExportBtn[data-mono="warn"] .v3dot{background:#f5b301}
#v3ExportBtn[data-mono="bad"] .v3dot{background:#ff5a4f}
#ratioSeg,#monoBtn,#reelBtn,#pngBtn,#jpgBtn,#shareBtn,#previewBtn,#undoBtn,#redoBtn,#shuffleBtn,#pvBtn{order:0!important}
/* finish sheet */
.v3sheetT{display:block;font-size:17px;margin:2px 6px 12px}
.v3mono{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:14px;background:var(--surface-2);padding:12px 12px;margin:0 0 10px;font-size:14.5px;font-weight:600;color:var(--text);text-align:left}
.v3mono>span:first-of-type{flex:1}
.v3mono #monoBadge{font-weight:700;font-family:'Inter','Hind Siliguri',sans-serif}
.v3mono.ok{color:var(--ok)}.v3mono.warn{color:#b07400}.v3mono.bad{color:var(--danger)}
.v3mono.ok>span:first-of-type,.v3mono.warn>span:first-of-type,.v3mono.bad>span:first-of-type{color:var(--text)}
.v3opt{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;color:var(--text);min-height:64px;transition:background .15s,transform .08s}
.v3opt:active{transform:scale(.985)}
.v3opt .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--text)}
.v3opt .tx{display:flex;flex-direction:column;min-width:0}
.v3opt b{font-size:15px;line-height:1.3}
.v3opt small{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.v3opt.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-bottom:8px}
.v3opt.hero .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.v3opt.hero small{color:var(--accent-ink);opacity:.82}
.v3grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.v3grid .v3opt{flex-direction:column;align-items:flex-start;gap:8px}
.v3opt.slim{min-height:50px;justify-content:center;border-style:dashed}
.v3opt.slim .ic{width:auto;height:auto;background:none}
#v3export .v2sbox{max-height:92vh;overflow:auto}
@media (hover:hover){.v3opt:not(.hero):hover{background:var(--surface-2)}}
/* settings pane spacing on phone */
@media (max-width:900px){
  .stagebar{padding:10px 0 0}
  .stagebar .btn{flex:1 1 0;flex-direction:column;min-height:52px}
  #v3ExportBtn{flex:1.7 1 0;flex-direction:row;gap:8px;font-size:14.5px!important;min-width:0}
  .v3seg button{font-size:13.5px;padding:9px 4px}
}
@media (min-width:901px){
  .v3grid{grid-template-columns:repeat(4,1fr)}
  #v3export .v2sbox{max-width:620px}
}

/* ===== TF Story Studio suite (Islamic part) ===== */
.install-ui,#v2Install,#installBanner{display:none!important}
.tfswitch{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tfswitch:active{transform:scale(.97)}
.tfswitch i{font-style:normal;font-size:16px;line-height:1}
.brand .tfsub{font-size:12px;font-weight:600;color:var(--accent);margin-left:2px}
#tfShare{z-index:95}
.tfsh{max-width:480px!important;width:100%;padding:16px 16px 18px!important;overflow:auto;max-height:92vh;display:flex;flex-direction:column;gap:12px;background:var(--surface)!important;color:var(--text)}
.tfsh-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.tfsh-h b{font-size:17px}
.tfsh-what{font-size:12.5px;color:var(--muted);margin-top:-6px}
.tfsh-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tfsh-grid button{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);cursor:pointer;min-height:62px;font:inherit}
.tfsh-grid button:active{transform:scale(.98)}
.tfsh-grid button[data-plat="other"]{grid-column:1/-1}
.tfsh-grid .pi{grid-row:1/3;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;font-size:18px}
.tfsh .pi.fb{background:#1877F2}.tfsh .pi.yt{background:#FF0000}.tfsh .pi.wa{background:#25D366}.tfsh .pi.dr{background:#1FA463}.tfsh .pi.ot{background:#6b7280}
.tfsh-grid b{font-size:14.5px;line-height:1.2}.tfsh-grid span{font-size:12px;color:var(--muted);line-height:1.3}
.tfsh-back{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font:inherit}
.tfsh-kit{display:flex;gap:12px;align-items:flex-start}
.tfsh-kit img{width:92px;border-radius:10px;border:1px solid var(--line);flex:none;object-fit:cover;background:var(--surface-2)}
.tfsh-rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.tfsh-row{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface-2)}
.tfsh-row .x{flex:1;min-width:0}.tfsh-row small{display:block;font-size:11.5px;color:var(--muted)}
.tfsh-row span{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tfsh-note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.tfsh-warn{font-size:13px;border-radius:12px;padding:10px 12px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text)}
.tfsh-main{width:100%;min-height:46px;font-weight:700}
@media (max-width:420px){.tfswitch span{display:none}.tfswitch{padding:0 10px}}
</style>
<style id="v8">
/* ===== v8 — unslop polish for the Islamic part. Header icons are drawn, buttons share one icon set, the phone header never overlaps. Posts, cards and saved data untouched. ===== */
.top .in{min-width:0}
.brand{min-width:0}

<body>
<header class="top">
  <div class="in">
    <div class="brand"><img src="icon-192.png" alt=""><b>TF Story <span class="tfsub">ইসলামিক</span></b></div>
    <div class="ctrls">
      <a class="tfswitch" id="tfToHome" href="../home.html" title="শুরুর পাতা: গল্প / ইসলামিক অংশ বাছুন"><i><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg></i><span>শুরু</span></a>
      <a class="tfswitch" id="tfToStory" href="../index.html?part=islamic" title="ইসলামিক গল্প-ভিডিও (কুরআন ও হাদিসের গল্প)"><i><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 5v4M12 5v4M17 5v4"/><path d="m10.5 12.2 3.6 2.1-3.6 2.1z"/></svg></i><span>গল্প-ভিডিও</span></a>
      <button type="button" class="btn primary hidden install-ui" id="installBtn"><span data-i18n="install"></span></button>
      <button type="button" class="icobtn" id="newPostBtn" title="New post" aria-label="New post"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></button>
      <button type="button" class="icobtn acct" id="acctBtn" title="Gmail দিয়ে লগইন (সব অংশে একই অ্যাকাউন্ট)" aria-label="অ্যাকাউন্ট"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg></button>
      <button type="button" class="icobtn" id="v2Theme" title="Theme" aria-label="Theme"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
      <button type="button" class="icobtn" id="v2MenuBtn" title="Menu" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button type="button" class="btn desk-only" id="langBtn">বাংলা</button>
      <button type="button" class="btn desk-only" id="themeBtn" title="theme">🌙</button>

  </div>

</header>
<main class="app">
  <!-- ===== STAGE: mode, live card, the few actions used on every post ===== -->
  <section class="stage card">
    <div class="v2top">
      <div class="seg mode" role="group" aria-label="mode">
        <button type="button" data-mode="general"><span class="lbl" data-i18n="mGeneral"></span></button>
        <button type="button" data-mode="islamic"><span class="lbl" data-i18n="mIslamic"></span></button>
      </div>
    </div>
    <div class="canvasbox"><canvas id="cv" width="1080" height="1080" aria-label="card preview"></canvas></div>

    <p class="hint" data-i18n="stageHint"></p>
    <div class="stagebar">
      <button type="button" class="btn" id="undoBtn" title="Ctrl+Z"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span data-i18n="undo"></span></button>
      <button type="button" class="btn" id="redoBtn" title="Ctrl+Y"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span data-i18n="redo"></span></button>
      <button type="button" class="btn" id="shuffleBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.6 2.4-1.2-1.2a1.2 1.2 0 0 0-1.7 0L2.4 17.5a1.2 1.2 0 0 0 0 1.7l1.2 1.2a1.2 1.2 0 0 0 1.7 0L21.6 4.1a1.2 1.2 0 0 0 0-1.7Z"/><path d="m14 7 3 3M5 6v4M19 14v4M10 2v2M7 8H3M21 16h-4M11 3H9"/></svg><span data-i18n="shuffle"></span></button>
      <button type="button" class="btn primary" id="v3ExportBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg><span data-v3t="export"></span><i class="v3dot" aria-hidden="true"></i></button>
      <button type="button" class="btn hidden" id="pvBtn" data-i18n="pvSize"></button>

    <!-- WRITE -->

        <button type="button" class="isl-only" data-gen="ayah" data-v3t="genAyah"></button>
      </div>
      <div id="gen-quick">
      <div class="sect qgen" id="qgen">
        <h4><span data-i18n="qgTitle"></span><small><span class="writerTag"></span> <span id="qgCount"></span></small></h4>
        <div class="keyhint warn hidden" data-keyhint><span data-i18n="needKey"></span> <button type="button" class="btn sm" data-goto="settings" data-i18n="openSettings"></button></div>

const IS_ANDROID = !!(window.TFAndroid && window.TFAndroid.isAndroid && (() => { try{ return window.TFAndroid.isAndroid(); }catch(e){ return false; } })());
async function androidSendFile(blob, name, action){
  const id = window.TFAndroid.fileBegin(String(name), blob.type || 'application/octet-stream'); const CH = 786432; /* multiple of 3 → clean base64 chunks */
  for(let off = 0; off < blob.size; off += CH){
    const u = new Uint8Array(await blob.slice(off, off + CH).arrayBuffer()); let s = ''; for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    if(!window.TFAndroid.fileChunk(id, btoa(s))) throw new Error('ফাইল লেখা গেল না');
  }
  const r = window.TFAndroid.fileEnd(id, action); if(String(r).startsWith('err')) throw new Error(String(r).slice(4)); return r;
}
window.androidSendFile = androidSendFile; /* used by the app's automatic self-test */

/* API keys are shared with the Story part: one key in settings works in both.
   Claude → tf_akey, Gemini → tf_gkey (plain strings, the Story part's own names; sessionStorage when "remember" is off there). */
const SHARED_KEYS = { ckey:'tf_akey', gkey:'tf_gkey' };
function sharedKeyGet(k, d){
  const n = SHARED_KEYS[k];
  try{ const v = sessionStorage.getItem(n) || localStorage.getItem(n); if(v) return v; }catch(e){}
  try{ const old = localStorage.getItem('tfpc_' + k); if(old !== null){ const v = JSON.parse(old); if(v){ sharedKeySet(k, v); return v; } } }catch(e){}
  return d;
}
function sharedKeySet(k, v){
  const n = SHARED_KEYS[k]; v = String(v || '').trim();
  try{
    localStorage.removeItem('tfpc_' + k);
    if(!v){ localStorage.removeItem(n); sessionStorage.removeItem(n); return true; }
    if(sessionStorage.getItem(n) && !localStorage.getItem(n)) sessionStorage.setItem(n, v); /* the Story part keeps this key for this session only */
    else { localStorage.setItem(n, v); sessionStorage.removeItem(n); }
    return true;
  }catch(e){ return false; }
}
const store = {
  get(k, d){ if(SHARED_KEYS[k]) return sharedKeyGet(k, d); if(MEMK(k)) return MEM.get(k, d); try{ const v = localStorage.getItem('tfpc_' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ if(SHARED_KEYS[k]) return sharedKeySet(k, v); if(MEMK(k)) return MEM.set(k, v); try{ localStorage.setItem('tfpc_' + k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
/* ===== 🧠 REPEAT-MEMORY: everything that must never repeat (stories, emotional lines, published cards, reels,
   hadith/ayah used) lives in IndexedDB — large, kept by the browser, untouched by any reset button.
   It is merged (never overwritten) when a memory backup is restored. ===== */
const MEMK = k => /^(st_hist_|qg_hist_|qg_angles_|reel_hist_|pub_hist_)/.test(k);
function memId(x){ return typeof x === 'string' ? x : (x && (x.k || x.text)) || JSON.stringify(x); }
function memMerge(a, b){
  if(!Array.isArray(a)) return Array.isArray(b) ? b : a; if(!Array.isArray(b)) return a;
  const seen = new Map(), out = [];
  a.concat(b).forEach(x => { const i = memId(x); if(seen.has(i)){ const o = seen.get(i); if(o && typeof o === 'object' && x && x.kinds) o.kinds = Array.from(new Set((o.kinds || []).concat(x.kinds))); return; } seen.set(i, x); out.push(x); });
  if(out.length && out[0] && typeof out[0] === 'object' && out[0].t) out.sort((x, y) => (x.t || 0) - (y.t || 0));
  return out;
}
const MEM = { db:null, data:{}, ok:false,
  open(){ return new Promise(res => { try{ const r = indexedDB.open('tfpc-memory', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); }catch(e){ res(null); } }); },
  async load(){
    this.db = await Promise.race([this.open(), new Promise(r => setTimeout(() => r(null), 4000))]);
    if(this.db) await new Promise(res => { try{ const rq = this.db.transaction('kv', 'readonly').objectStore('kv').openCursor();
      rq.onsuccess = () => { const c = rq.result; if(c){ this.data[c.key] = c.value; c.continue(); } else { this.ok = true; res(); } }; rq.onerror = () => res(); }catch(e){ res(); } });
    try{ Object.keys(localStorage).forEach(full => { if(full.indexOf('tfpc_') !== 0) return; const k = full.slice(5); if(!MEMK(k)) return;
      const v = JSON.parse(localStorage.getItem(full)); this.data[k] = memMerge(this.data[k], v); if(this.ok){ this.put(k); localStorage.removeItem(full); } }); }catch(e){}
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  },
  get(k, d){ return Object.prototype.hasOwnProperty.call(this.data, k) ? this.data[k] : d; },
  set(k, v){ this.data[k] = v; if(this.ok) this.put(k); else { try{ localStorage.setItem('tfpc_' + k, JSON.stringify(v)); }catch(e){ return false; } } return true; },
  put(k){ try{ this.db.transaction('kv', 'readwrite').objectStore('kv').put(this.data[k], k); }catch(e){} },
  merge(k, v){ this.set(k, memMerge(this.get(k, []), v)); },
  keys(){ return Object.keys(this.data).filter(MEMK); }
};
const BN = '০১২৩৪৫৬৭৮৯';
const bnNum = s => String(s).replace(/\d/g, d => BN[d]);
const norm = s => String(s || '').replace(/ /g, ' ').replace(/[​﻿]/g, '').replace(/\s+/g, ' ').trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const safeName = s => (String(s || 'card').replace(/[*\\/:?"<>|\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60) || 'card');
function withTimeout(ms){ const c = new AbortController(); const id = setTimeout(() => c.abort(), ms); return { signal: c.signal, done: () => clearTimeout(id) }; }
function download(blob, name){ if(IS_ANDROID){ androidSendFile(blob, name, 'save').catch(e => toast('সেভ হলো না: ' + (e && e.message || e))); return; } const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
let toastT; function toast(m){ const e = $('toast'); e.textContent = m; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 3000); }
function busy(id, on){ const e = $(id); if(e) e.classList.toggle('hidden', !on); }
async function copyText(s){
  try{ await navigator.clipboard.writeText(s); return true; }catch(e){}
  try{ const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
function friendly(m){ const e = new Error(m); e.friendly = true; return e; }

async function writeAround(src, topic){
  const prompt = 'Write a Bengali Facebook post about "' + (topic || 'this source') + '" built around the VERIFIED SOURCE below, in the page owner\'s style.' + styleBlock() +
    'Structure: "intro" = a short lead-in that introduces who is speaking (for Quran: e.g. "আল্লাহ বলেছেন," / "আল্লাহ কুরআনে বলেছেন,"; for hadith use the speaker shown in the source text, e.g. "রাসূলুল্লাহ ﷺ বলেছেন,"; for a hadith qudsi "আল্লাহ বলেছেন,"). "quote" = the most touching contiguous part of the SOURCE TEXT, copied EXACTLY word-for-word (you may only add line breaks \\n between its parts; never change, add or drop words; do not include the chain of narrators). "reflection" = 1–3 short, emotional lines in the owner\'s voice (e.g. starting with "সুবহানাল্লাহ…", "আহ্…"), your own words, not attributed to Allah or the Prophet ﷺ. "heading" = a 1–3 word label. "hashtags" = 3–4 hashtags without #.' + MONO_GUARD + ' If the source does not really fit the topic set "relevant": false. Return ONLY JSON {"relevant":true,"heading":"","intro":"","quote":"","reflection":"","hashtags":[]}.\n\nSOURCE TYPE: ' + (src.kind === 'quran' ? 'Quran (Bengali translation)' : 'Hadith (Bengali translation)') + '\nREFERENCE: ' + src.ref + '\nSOURCE TEXT:\n' + src.text.slice(0, 4000);
  const r = await writeAI({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { temperature: 0.8, responseMimeType: 'application/json' } }, 70000);
  const o = parseJson(r.text);
  if(o.relevant === false) return null;
  let quote = String(o.quote || '').replace(/\\n/g, '\n').replace(/^["“'«\s]+|["”'»\s]+$/g, '').trim();
  if(quote.length < 12 || !keyNorm(src.text).includes(keyNorm(quote))){ if(src.text.length <= 320) quote = src.text; else return null; }
  const intro = norm(o.intro || ''), refl = clean(o.reflection || '').replace(/\\n/g, '\n').trim();
  if(SACRED_PAT.test(refl.replace(/আল্লাহ/g, ''))) return null;
  const text = (intro ? intro + ' ' : '') + '"' + quote + '"' + (refl ? '\n\n' + refl : '');
  return { heading: norm(o.heading || ''), text, ref: src.ref, arabic: src.arabic, full: { text: src.text, arabic: src.arabic, ref: src.ref }, tags: (Array.isArray(o.hashtags) ? o.hashtags : []) };
}
async function verifiedPosts(topic, want){
  const out = [];
  if($('aiSource').value === 'card'){
    const f = F(); if(!['hadith', 'ayah', 'sacred'].includes(f.origin)) throw friendly(t('tNeedCardSource'));
    const full = f.full || { text: String(f.text).replace(/\*/g, ''), arabic: f.arabic, ref: f.ref };
    const p = await writeAround({ kind: f.origin === 'hadith' ? 'hadith' : 'quran', text: full.text, arabic: full.arabic || '', ref: full.ref || f.ref }, topic);
    if(p) out.push(p); return out;
  }
  const cands = (await pickSources(topic)).map((c, i) => ({ c, i })).sort((a, b) => (srcPosted(a.c) - srcPosted(b.c)) || (a.i - b.i)).map(x => x.c);
  for(const c of cands){
    if(out.length >= want) break;
    try{ const src = await fetchSource(c); if(out.some(x => x.ref === src.ref)) continue; const p = await writeAround(src, topic); if(p) out.push(p); }catch(e){ if(authErr(e) || e.status === 429) throw e; }
  }
  if(!out.length) throw friendly(t('tNoVerified'));
  return out;
}
function postCaption(p){
  const b = B(), brandTags = norm(b.tags).split(/\s+/).filter(Boolean), tags = (p.tags || []).map(h => '#' + String(h).replace(/^#+/, '').replace(/\s+/g, '_')).filter(h => h.length > 1);
  const all = $('capTags').checked ? Array.from(new Set(brandTags.concat(tags))).slice(0, 5).join(' ') : '';
  return p.text.replace(/\*/g, '') + (p.ref ? '\n\nসূত্র: ' + p.ref : '') + (p.caption ? '\n\n' + p.caption : '') + (all ? '\n\n' + all : '');
}

function hlSelected(){
  const ta = $('f-text'), v = ta.value; let a = ta.selectionStart, b = ta.selectionEnd;
  if(a === b){ toast(t('tSelFirst')); ta.focus(); return; }
  while(a < b && /\s/.test(v[a])) a++; while(b > a && /\s/.test(v[b - 1])) b--;
  const sel = v.slice(a, b).replace(/\*/g, ''); if(!sel){ toast(t('tSelFirst')); return; }
  pushUndo(); F().text = v.slice(0, a) + '*' + sel + '*' + v.slice(b); syncFields(); saveSoon(); render();
}
function hlClear(){ const f = F(); if(!/\*/.test(f.text)) return; pushUndo(); f.text = f.text.replace(/\*/g, ''); syncFields(); saveSoon(); render(); }
function wrapPhrases(text, phrases){
  let out = text, n = 0;
  phrases.forEach(p => {
    p = norm(String(p || '').replace(/\*/g, '')); if(p.length < 2 || n >= 3) return;
    let from = 0;
    while(true){
      const i = out.indexOf(p, from); if(i < 0) return;
      const before = (out.slice(0, i).match(/\*/g) || []).length;
      if(before % 2 === 0){ out = out.slice(0, i) + '*' + p + '*' + out.slice(i + p.length); n++; return; }
      from = i + p.length;
    }
  });
  return { text: out, n };
}
async function hlAuto(){
  const f = F(), plain = String(f.text || '').replace(/\*/g, '');
  if(!norm(plain)){ toast(t('tEmpty')); return; }
  const btn = $('hlAutoBtn'); btn.disabled = true;
  try{
    let phrases = [];
    if(S.ckey){
      try{
        const r = await writeAI({ contents: [{ role: 'user', parts: [{ text: 'From this Bengali social-media card text, choose the 1 to 3 most powerful, emotional short phrases (1–4 words each) that should be visually highlighted. Copy each phrase EXACTLY as it appears in the text. Return ONLY JSON {"phrases":[]}.\n\nTEXT:\n' + plain }] }], generationConfig: { temperature: 0.2, responseMimeType: 'application/json' } }, 40000);
        phrases = (parseJson(r.text).phrases || []).filter(p => plain.includes(norm(p)));
      }catch(e){ if(authErr(e)) throw e; }
    }
    if(!phrases.length){
      const words = plain.split(/[\s,।!?;:"“”'‘’()\-—…]+/).filter(Boolean);
      HL_WORDS[MODE].forEach(k => { if(phrases.length < 2){ const w = words.find(x => x === k || (x.startsWith(k) && x.length - k.length <= 3)); if(w && !phrases.includes(w)) phrases.push(w); } });
    }
    const res = wrapPhrases(plain, phrases);
    if(!res.n){ toast(t('tHlNone')); return; }
    pushUndo(); f.text = res.text; syncFields(); saveSoon(); render();
  }catch(e){ toast(aiErr(e)); }
  finally{ btn.disabled = false; }
}

  } else {

function baitHits(s){ const out = []; sentences(s).forEach(seg => { if(BAIT_RX.some(r => r.test(seg))) out.push(norm(seg).slice(0, 60)); }); return out; }
function clickHits(s){ return Array.from(new Set((String(s || '').match(CLICK_RX) || []).map(x => x.trim()))); }
const tagList = s => (String(s || '').match(/(^|\s)#[^\s#]+/g) || []).map(x => x.trim());
const emojiN = s => (String(s || '').match(/\p{Extended_Pictographic}/gu) || []).length;
function ownWordsLen(cap){
  const f = F(), p = cardPlain(), card = keyNorm([p.heading, p.text, f.note, f.arabic, f.full && f.full.text, f.full && f.full.arabic].join(' ')), ref = keyNorm(f.ref || (f.full && f.full.ref) || '');
  let n = 0;
  String(cap || '').replace(/(^|\s)#[^\s#]+/g, ' ').split('\n').forEach(l => { const k = keyNorm(l.replace(/^(সূত্র|রেফারেন্স|source)\s*[:：]/i, '')); if(k.length < 6) return; if(card.includes(k) || (ref && (k === ref || ref.includes(k) || k.includes(ref)))) return; n += k.length; });
  return n;
}
const sacredOut = s => { const f = F(), ft = f.full && f.full.text; return ft && isSacred() ? String(s || '').split(ft).join(' ') : String(s || ''); };
function monoCheck(){
  const items = [], f = F(), cap = sacredOut($('capText').value || ''), p = cardPlain();
  const add = (lvl, title, fix) => items.push({ lvl, title, fix });
  const fill = (s, o) => String(s).replace(/\{(\w)\}/g, (m, k) => o[k] != null ? o[k] : m);
  if(brandText() || C.logos[MODE]) add('ok', t('c_brandOk')); else add('bad', t('c_brandBad'), t('c_brandFix'));
  const bait = baitHits(cap).concat(isSacred() ? [] : baitHits([p.heading, p.text, f.note].join('\n')));
  if(bait.length) add('bad', fill(t('c_baitBad'), { x: '“' + bait.slice(0, 2).join('”, “') + '”' }), t('c_baitFix')); else add('ok', t('c_baitOk'));
  const click = clickHits(cap + '\n' + p.heading + '\n' + p.text);
  if(click.length) add('warn', fill(t('c_click'), { x: click.slice(0, 3).join(', ') }), t('c_clickFix'));
  if(!norm(cap)) add('warn', t('c_capEmpty'), t('c_capEmptyFix'));
  else if(ownWordsLen(cap) >= 25) add('ok', t('c_ownOk')); else add('warn', t('c_ownBad'), t('c_ownFix'));
  const nt = tagList(cap).length;
  if(nt > 5) add('warn', fill(t('c_tagsBad'), { n: LANG === 'bn' ? bnNum(nt) : nt }), t('c_tagsFix')); else if(nt) add('ok', fill(t('c_tagsOk'), { n: LANG === 'bn' ? bnNum(nt) : nt }));
  if(isSacred() || SACRED_PAT.test(p.text)){ if(norm(f.ref) || (f.full && norm(f.full.ref))) add('ok', t('c_srcOk')); else add('bad', t('c_srcBad'), t('c_srcFix')); }
  if(hasImg()){
    if(C.isrc === 'link') add('bad', t('c_imgLink'), t('c_imgLinkFix'));
    else if(C.isrc === 'upload') { if(norm(f.credit)) add('ok', t('c_imgUpOk')); else add('warn', t('c_imgUp'), t('c_imgUpFix')); }
    else if(C.isrc === 'ai') add('info', t('c_imgAi'), t('c_imgAiFix'));
  }
  if(C.textFs < 34) add('warn', t('c_small'), t('c_smallFix'));
  const r = D().ratio, rb = LANG === 'bn' ? r.replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]) : r;
  if(r === '4:5' || r === '1:1') add('ok', fill(t('c_ratioOk'), { r: rb })); else add('warn', fill(t('c_ratioBad'), { r: rb }), t('c_ratioFix'));
  const ne = emojiN(cap); if(ne > 8) add('warn', fill(t('c_emoji'), { n: LANG === 'bn' ? bnNum(ne) : ne }), t('c_emojiFix'));
  const bad = items.filter(i => i.lvl === 'bad').length, warn = items.filter(i => i.lvl === 'warn').length;
  return { items, bad, warn, pass: items.length - bad - warn, total: items.length };
}
let monoT = 0;
function renderMono(){
  const r = monoCheck(), box = $('monoList'); if(!box) return r;
  box.innerHTML = '';
  r.items.slice().sort((a, b) => ({ bad: 0, warn: 1, info: 2, ok: 3 }[a.lvl] - { bad: 0, warn: 1, info: 2, ok: 3 }[b.lvl])).forEach(it => {
    const d = document.createElement('div'); d.className = 'mi ' + it.lvl;
    const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = { ok: '✓', warn: '!', bad: '✕', info: 'i' }[it.lvl];
    const tx = document.createElement('div'); const b = document.createElement('b'); b.textContent = it.title; tx.appendChild(b);
    if(it.fix && it.lvl !== 'ok'){ const s = document.createElement('small'); s.textContent = it.fix; tx.appendChild(s); }
    d.append(ic, tx); box.appendChild(d);
  });
  const sc = t('monoScore').replace('{a}', LANG === 'bn' ? bnNum(r.pass) : r.pass).replace('{b}', LANG === 'bn' ? bnNum(r.total) : r.total);
  $('monoScore').textContent = r.bad || r.warn ? sc : '✓ ' + t('monoAll');
  const mb = $('monoBtn'); mb.classList.remove('ok', 'warn', 'bad'); mb.classList.add(r.bad ? 'bad' : r.warn ? 'warn' : 'ok');
  $('monoBadge').textContent = '🛡️ ' + (LANG === 'bn' ? bnNum(r.pass) + '/' + bnNum(r.total) : r.pass + '/' + r.total);
  $('brandNudge').classList.toggle('hidden', !!(brandText() || C.logos[MODE]));
  return r;
}
function monoSoon(){ clearTimeout(monoT); monoT = setTimeout(renderMono, 250); }
function stripBait(s){
  return String(s || '').split('\n').map(line => sentences(line).filter(seg => !BAIT_RX.some(r => r.test(seg))).join(' ')).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
function monoFix(){
  let changed = false;
  const cap = $('capText').value, f = F(), ft = f.full && f.full.text && isSacred() && cap.includes(f.full.text) ? f.full.text : '';
  const KEEP = '\u2063SACRED\u2063';
  let nc = stripBait(ft ? cap.split(ft).join(KEEP) : cap);
  if(ft) nc = nc.split(KEEP).join(ft);
  const tags = tagList(nc);
  if(tags.length > 5){ const keep = Array.from(new Set(tags)).slice(0, 5); nc = nc.replace(/(^|\s)#[^\s#]+/g, '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim() + '\n\n' + keep.join(' '); }
  if(nc !== cap.trim()){ setCaption(nc); changed = true; }
  if(!isSacred()){ ['heading', 'text', 'note'].forEach(k => { const v = f[k] || '', nv = stripBait(v); if(norm(nv) && nv !== v.trim() && baitHits(v).length){ if(!changed) pushUndo(); f[k] = nv; changed = true; } }); if(changed){ syncFields(); saveSoon(); render(); } }
  if(D().ratio === '9:16' || D().ratio === '16:9'){ D().ratio = '4:5'; syncDesign(); saveSoon(); render(); changed = true; }
  renderMono(); toast(changed ? t('tMonoFixed') : t('tMonoNothing'));
}
function monoWarn(){ const r = monoCheck(); return r.bad ? t('tMonoIssues').replace('{n}', LANG === 'bn' ? bnNum(r.bad) : r.bad) : ''; }

const ICD = { CH: 180000, seen: false, sig: {}, libIds: null, timer: 0, unsub: null,
  memDoc: k => 'icd_m_' + k, libDoc: id => 'icd_l_' + String(id).slice(0, 50),
  start(){

    const _set = MEM.set.bind(MEM); MEM.set = (k, v) => { const r = _set(k, v); ICD.soon(); return r; };
    const _save = saveLib; saveLib = function(){ _save(); ICD.soon(); };

  apply(q){

      if(id.startsWith('icd_l_')){ try{ lib.push(JSON.parse(txt)); }catch(e){} return; }

  },
  soon(){ if(!this.seen) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 2500); },
  async flush(){ clearTimeout(this.timer); if(this.seen) await this.push(); },

    catch(e){ console.warn('cloud', e); toast(C.msg(e)); return false; }
  }

    $('v2MenuBtn').addEventListener('click', openMenu);
    $('v2menu').addEventListener('click', e => {
      if(e.target === e.currentTarget){ closeMenu(); return; }
      const g = e.target.closest('[data-v2go]'); if(g) go(g.dataset.v2go);
    });
    $('v2Lang').addEventListener('click', () => { $('langBtn').click(); setTimeout(syncLabels, 30); });
    $('v2Install').addEventListener('click', () => { closeMenu(); const b = $('installBtn3') || $('installBtn'); if(b) b.click(); });
    $('v2Theme').addEventListener('click', () => { $('themeBtn').click(); syncTheme(); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(); });
    let ticking = false;
    addEventListener('scroll', () => { if(ticking) return; ticking = true; requestAnimationFrame(() => { document.body.classList.toggle('v2scrolled', scrollY > 4); ticking = false; }); }, { passive:true });
    sweep(); syncLabels(); syncTheme(); observe();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(start, 0)); else setTimeout(start, 0);
})();
</script>
<script id="v3js">
/* ===== TF Post Maker v3 — labels for the regrouped layout, the finish sheet ===== */
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const T = {
    bn:{ export:'সেভ ও শেয়ার', genQuick:'AI পোস্ট', genStory:'গল্প', genHadith:'হাদিস', genAyah:'আয়াত',
         desLook:'স্টাইল', desImage:'ব্যাকগ্রাউন্ড', desBrand:'পেজ ও লোগো', ratio:'কার্ডের সাইজ',
         hlLbl:'হাইলাইট', aiTools:'AI দিয়ে লেখা ঠিক করুন',
         exTitle:'পোস্ট রেডি — এখন কী করবেন?', monoLbl:'মনিটাইজেশন চেক',
         exShare:'শেয়ার করুন', exShareS:'Facebook · YouTube · WhatsApp — প্রতিটার জন্য আলাদা লেখা',
         exPng:'ছবি সেভ', exPngS:'PNG · সবচেয়ে ভালো মান', exJpg:'ছোট সাইজে সেভ', exJpgS:'JPG · দ্রুত আপলোড',
         exReel:'রিল বানান', exReelS:'মোশন ও মিউজিকসহ ভিডিও', exLib:'লাইব্রেরিতে রাখুন', exLibS:'পরে আবার ব্যবহার করতে',
         exPrev:'বড় করে দেখুন' },
    en:{ export:'Save & share', genQuick:'AI post', genStory:'Story', genHadith:'Hadith', genAyah:'Ayah',
         desLook:'Style', desImage:'Background', desBrand:'Page & logo', ratio:'Card size',
         hlLbl:'Highlight', aiTools:'Improve the text with AI',
         exTitle:'Post ready — what next?', monoLbl:'Monetization check',
         exShare:'Share', exShareS:'Facebook · YouTube · WhatsApp — separate text for each',
         exPng:'Save image', exPngS:'PNG · best quality', exJpg:'Save smaller', exJpgS:'JPG · faster upload',
         exReel:'Make a reel', exReelS:'Video with motion & music', exLib:'Save to library', exLibS:'To reuse it later',
         exPrev:'View full size' }
  };
  const lang = () => (root.lang === 'bn' ? 'bn' : 'en');
  function labels(){
    const d = T[lang()];
    document.querySelectorAll('[data-v3t]').forEach(e => { const v = d[e.dataset.v3t]; if(v != null && e.textContent !== v) e.textContent = v; });
  }
  const sheet = () => $('v3export');
  function openSheet(){ labels(); sheet().classList.remove('hidden'); }
  function closeSheet(){ sheet().classList.add('hidden'); }
  function mirrorMono(){
    const b = $('monoBtn'), x = $('v3ExportBtn'); if(!b || !x) return;
    const st = b.classList.contains('bad') ? 'bad' : b.classList.contains('warn') ? 'warn' : 'ok';
    if(x.dataset.mono !== st) x.dataset.mono = st;
  }
  function start(){
    $('v3ExportBtn').addEventListener('click', openSheet);
    /* the app's own handlers run first (they sit on the buttons); then the sheet closes */
    sheet().addEventListener('click', e => {
      if(e.target === e.currentTarget){ closeSheet(); return; }
      if(e.target.closest('button')) setTimeout(closeSheet, 0);
    });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
    new MutationObserver(mirrorMono).observe($('monoBtn'), { attributes:true, attributeFilter:['class'] });
    new MutationObserver(labels).observe(root, { attributes:true, attributeFilter:['lang'] });
    labels(); mirrorMono();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(start, 0)); else setTimeout(start, 0);
})();
</script>
