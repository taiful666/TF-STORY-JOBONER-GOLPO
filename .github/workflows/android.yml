name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-*.png'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      vn: ${{ steps.name.outputs.vn }}
    env:
      TF_VERSION_NAME: '3.4'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner) — accept licences, add platform 35
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          ls "$SDK/platforms" "$SDK/build-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the web app inside the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png android/app/src/main/assets/www/

      - name: Prepare signing key (from encrypted GitHub secrets — never stored in the repo)
        id: sign
        env:
          KS_B64: ${{ secrets.TF_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.TF_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TF_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "TF_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing key found."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are missing (TF_KEYSTORE_BASE64 / TF_KEYSTORE_PASSWORD). A test APK is built but NOT published as an update."
          fi

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the APK and show its signature
        id: name
        run: |
          VN="${TF_VERSION_NAME}.${GITHUB_RUN_NUMBER}"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/TF-Story-Studio-v$VN.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "out/TF-Story-Studio-v$VN.apk" | grep -E "SHA-256|DN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and open the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/ci/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator-screenshot, path: screen.png, if-no-files-found: ignore }

  release:
    needs: [build, test]
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk, path: out }
      - name: Publish update (GitHub Release → the app shows "নতুন আপডেট এসেছে")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: TF Story Studio ${{ needs.build.outputs.vn }}
          body: ${{ github.event.head_commit.message || 'নতুন আপডেট' }}
          files: out/*.apk
          make_latest: true
